
name: Generateur APK General

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparer Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Installer Cordova
        run: npm install -g cordova@12

      - name: Preparer projet HTML
        shell: bash
        run: |
          set -e

          cordova create /tmp/mon-apk \
            com.absabefi.application \
            MonApplication

          rm -rf /tmp/mon-apk/www
          mkdir -p /tmp/mon-apk/www

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='platforms' \
            --exclude='plugins' \
            --exclude='config.xml' \
            --exclude='package.json' \
            ./ /tmp/mon-apk/www/

          test -f /tmp/mon-apk/www/index.html

      - name: Installer outil icones
        run: npm install -g sharp-cli

      - name: Configurer icone Android
        shell: bash
        run: |
          set -e

          ICON=""

          for file in \
            Horloge.png \
            icon.png \
            Icon.png \
            logo.png
          do
            if [ -f "$GITHUB_WORKSPACE/$file" ]; then
              ICON="$GITHUB_WORKSPACE/$file"
              break
            fi
          done

          if [ -n "$ICON" ]; then
            echo "Icone trouvee: $ICON"

            mkdir -p /tmp/mon-apk/res

            sharp \
              --input "$ICON" \
              --output /tmp/mon-apk/res/icon.png \
              resize 1024 1024

            node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/mon-apk/config.xml';
          let xml = fs.readFileSync(path, 'utf8');
          xml = xml.replace(
            '</widget>',
            '    <icon src="res/icon.png" />\n</widget>'
          );
          fs.writeFileSync(path, xml);
          NODE
          else
            echo "Aucune icone trouvee"
          fi

      - name: Ajouter Android
        working-directory: /tmp/mon-apk
        run: cordova platform add android@14

      - name: Compiler APK
        working-directory: /tmp/mon-apk
        run: cordova build android --debug

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Android
          path: /tmp/mon-apk/platforms/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
